# -----------------------------------------------------------------------------
# CMS application
# -----------------------------------------------------------------------------
server.port=8080
spring.application.name=cms-application

# -----------------------------------------------------------------------------
# Admin login for the POC
# Change these values outside a local POC.
# -----------------------------------------------------------------------------
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# -----------------------------------------------------------------------------
# File-based H2 exposed through an H2 TCP server started by the CMS JVM.
# Kafka uses 9092, therefore H2 intentionally uses 9093.
# The physical file is ./data/cms-poc.mv.db.
# A separate process visualizer can connect while CMS is running with:
# jdbc:h2:tcp://localhost:9093/cms-poc
# -----------------------------------------------------------------------------
cms.h2.tcp.enabled=true
cms.h2.tcp.port=9093
cms.h2.tcp.allow-others=false
cms.h2.base-dir=./data
cms.h2.database-name=cms-poc
spring.datasource.url=jdbc:h2:tcp://localhost:${cms.h2.tcp.port}/${cms.h2.database-name};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# -----------------------------------------------------------------------------
# Camunda 7 embedded engine
# -----------------------------------------------------------------------------
camunda.bpm.database.schema-update=true
camunda.bpm.history-level=audit
camunda.bpm.job-execution.enabled=true
camunda.bpm.auto-deployment-enabled=true
camunda.bpm.deployment-resource-pattern=classpath*:/processes/*.bpmn

# -----------------------------------------------------------------------------
# Kafka
# -----------------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.ack-mode=record

cms.kafka.batch-topic=cms.batch.command.v1
cms.kafka.dlt-topic=cms.batch.dlt.v1
cms.kafka.consumer-group=cms-batch-workers-v1
cms.kafka.dlt-consumer-group=cms-batch-dlt-v1
cms.kafka.partitions=12
cms.kafka.replication-factor=1

# -----------------------------------------------------------------------------
# Batch and worker tuning
# worker.concurrency controls worker threads in this single CMS JVM.
# batch.default-size is the default logical CMS batch size shown in the UI.
# Both are deliberately properties, not hard-coded values.
# -----------------------------------------------------------------------------
cms.batch.default-size=5000
cms.batch.max-size=20000
cms.worker.concurrency=4
cms.worker.max-attempts=3
cms.worker.retry-delay-ms=2000
cms.worker.instance-id=CMS-WORKER-LOCAL

# Synthetic POC input data. In a real CMS this would be replaced by the actual
# transaction selection/query for the selected cycle parameters.
cms.cycle.default-transaction-count=50000
cms.cycle.max-transaction-count=500000

# -----------------------------------------------------------------------------
# Remote rule engine
# -----------------------------------------------------------------------------
cms.rule-engine.base-url=http://localhost:8090
cms.rule-engine.batch-evaluation-path=/api/v1/rules/batch/evaluate
cms.rule-engine.connect-timeout-ms=5000
cms.rule-engine.read-timeout-ms=120000
cms.rule-engine.max-items-per-request=5000

# -----------------------------------------------------------------------------
# Outbox and stage completion polling
# -----------------------------------------------------------------------------
cms.outbox.poll-ms=500
cms.outbox.publish-limit=100
cms.stage-correlation.poll-ms=1000

# Existing process visualizer integration. Change to your visualizer URL.
cms.visualizer.base-url=http://localhost:8085

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.example.cms=INFO
logging.level.org.camunda.bpm.engine.jobexecutor=INFO
